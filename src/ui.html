<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 12px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--figma-color-text, #1e1e1e);
        background: var(--figma-color-bg, #fff);
      }
      main { display: grid; gap: 14px; padding: 16px; }
      h1, h2, p { margin: 0; }
      h1 { font-size: 15px; font-weight: 650; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--figma-color-text-secondary, #777); }
      .intro, .muted { color: var(--figma-color-text-secondary, #777); line-height: 1.45; }
      .selection, .panel {
        border: 1px solid var(--figma-color-border, #ddd);
        border-radius: 8px;
        padding: 10px;
      }
      .selection { display: grid; gap: 4px; }
      .selection strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      button {
        min-height: 32px;
        border: 1px solid var(--figma-color-border, #ccc);
        border-radius: 6px;
        padding: 7px 10px;
        color: var(--figma-color-text, #111);
        background: var(--figma-color-bg-secondary, #f5f5f5);
        font: inherit;
        font-weight: 550;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--figma-color-bg-brand, #0d99ff);
        color: var(--figma-color-text-onbrand, white);
        background: var(--figma-color-bg-brand, #0d99ff);
      }
      button:disabled { cursor: default; opacity: .45; }
      button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--figma-color-border-brand, #0d99ff); outline-offset: 2px; }
      details { border-top: 1px solid var(--figma-color-border, #ddd); padding-top: 12px; }
      summary { cursor: pointer; font-weight: 600; }
      .options { display: grid; gap: 10px; margin-top: 10px; }
      label { display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
      label input { margin-top: 2px; }
      #status { min-height: 18px; color: var(--figma-color-text-secondary, #777); }
      #status.error { color: var(--figma-color-text-danger, #d13b3b); }
      #preview {
        max-height: 190px;
        overflow: auto;
        margin: 8px 0 0;
        padding: 10px;
        border-radius: 6px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--figma-color-text-secondary, #555);
        background: var(--figma-color-bg-secondary, #f4f4f4);
        font: 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #warnings, #assets { display: grid; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
      #warnings li { color: var(--figma-color-text-warning, #8a5a00); line-height: 1.4; }
      .asset { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
      .asset span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .asset button { min-height: 28px; padding: 4px 8px; }
      .hidden { display: none; }
      @media (max-width: 330px) { .actions { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Figmagent</h1>
        <p class="intro">Copy precise, platform-neutral design context for an AI implementation.</p>
      </header>

      <section class="selection" aria-labelledby="selection-heading">
        <h2 id="selection-heading">Selection</h2>
        <strong id="selection-name">Waiting for Figma…</strong>
        <span id="selection-meta" class="muted"></span>
      </section>

      <section class="actions" aria-label="Export design context">
        <button id="copy-ai" class="primary" disabled>Copy for AI</button>
        <button id="copy-json" disabled>Copy JSON</button>
        <button id="prepare" disabled>Prepare assets</button>
      </section>

      <div id="status" role="status" aria-live="polite"></div>

      <details>
        <summary>Advanced options</summary>
        <div class="options">
          <label><input id="include-hidden" type="checkbox" /> Include hidden descendant layers</label>
          <label><input id="include-all" type="checkbox" /> Include all referenced variants and variable modes</label>
        </div>
      </details>

      <section id="output-panel" class="panel hidden" aria-labelledby="output-heading">
        <h2 id="output-heading">Latest output</h2>
        <p id="output-meta" class="muted"></p>
        <pre id="preview"></pre>
      </section>

      <section id="warnings-panel" class="panel hidden" aria-labelledby="warnings-heading">
        <h2 id="warnings-heading">Warnings</h2>
        <ul id="warnings"></ul>
      </section>

      <section id="assets-panel" class="panel hidden" aria-labelledby="assets-heading">
        <h2 id="assets-heading">Companion assets</h2>
        <ul id="assets"></ul>
      </section>
    </main>
    <script>/*__UI_SCRIPT__*/</script>
  </body>
</html>
